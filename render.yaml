services:
  - type: web
    name: pharmacare-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: your MongoDB Atlas or remote connection string
      - key: CLIENT_URL
        sync: false # Set in Render Dashboard: your Vercel frontend URL (e.g. https://pharmacare-frontend.vercel.app)
